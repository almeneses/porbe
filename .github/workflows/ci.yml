name: Calidad

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Java
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Descargar código
        uses: actions/checkout@v6

      - name: Preparar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Descargar dependencias
        run: mvn --batch-mode dependency:go-offline

      - name: Compilar y ejecutar pruebas
        shell: bash
        run: |
          BYTE_BUDDY_AGENT="$(find "$HOME/.m2/repository/net/bytebuddy/byte-buddy-agent" \
            -type f -name 'byte-buddy-agent-[0-9]*.jar' | sort -V | tail -n 1)"

          if [ -z "$BYTE_BUDDY_AGENT" ]; then
            echo "No se encontró Byte Buddy Agent."
            exit 1
          fi

          mvn --batch-mode clean verify \
            -DargLine="-javaagent:$BYTE_BUDDY_AGENT"

  frontend:
    name: Frontend React
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Descargar código
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar calidad del código
        run: npm run lint

      - name: Ejecutar pruebas
        run: npm test

      - name: Construir frontend
        run: npm run build

  whatsapp:
    name: Servicio WhatsApp
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: whatsapp-service

    steps:
      - name: Descargar código
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: whatsapp-service/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test

      - name: Revisar vulnerabilidades críticas
        run: npm audit --omit=dev --audit-level=critical

  deploy:
    name: Desplegar en producción
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs:
      - backend
      - frontend
      - whatsapp
    runs-on: ubuntu-24.04
    environment: prod
    timeout-minutes: 30
    concurrency:
      group: porbe-prod
      cancel-in-progress: false

    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v6

      - name: Preparar conexión SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/porbe_deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/porbe_deploy" "$HOME/.ssh/known_hosts"

      - name: Copiar versión al servidor
        run: |
          RELEASE_DIR="/opt/porbe/releases/$GITHUB_SHA"

          ssh -i "$HOME/.ssh/porbe_deploy" -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" "mkdir -p '$RELEASE_DIR'"

          rsync -az --delete \
            --exclude '.git/' \
            --exclude 'backend/target/' \
            --exclude 'frontend/node_modules/' \
            --exclude 'frontend/dist/' \
            --exclude 'whatsapp-service/node_modules/' \
            -e "ssh -i $HOME/.ssh/porbe_deploy -p $VPS_PORT" \
            ./ "$VPS_USER@$VPS_HOST:$RELEASE_DIR/"

      - name: Construir e iniciar Porbe
        run: |
          RELEASE_DIR="/opt/porbe/releases/$GITHUB_SHA"

          ssh -i "$HOME/.ssh/porbe_deploy" -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" "
              set -eu
              cd '$RELEASE_DIR'
              docker compose --env-file /opt/porbe/config/porbe.env \
                -f compose.prod.yaml config --quiet
              docker compose --env-file /opt/porbe/config/porbe.env \
                -f compose.prod.yaml build --pull
              docker compose --env-file /opt/porbe/config/porbe.env \
                -f compose.prod.yaml up -d --remove-orphans --wait
              ln -sfn '$RELEASE_DIR' /opt/porbe/current
              docker compose --env-file /opt/porbe/config/porbe.env \
                -f compose.prod.yaml ps
            "
